plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trading'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    // 教學本機：內嵌 broker，bootRun 不必 Docker（正式可改外接）
    implementation 'org.springframework.kafka:spring-kafka-test'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    description = 'Runs unit tests (excludes @Tag integration)'
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (@Tag integration)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// 【職責】自動截圖操作手冊（docs/manual，run-manual.ps1 產生）打進 static/manual，前台導航列「操作手冊」直接開 /manual/操作手冊.html
// 【技巧】只帶 html／md 與 shots/*.png；_fail-*.png 是劇本失敗的除錯截圖、*.mjs 是產生器，都不進 jar
// 【概念】手冊在 git 只有 docs/manual 一份，不複製進 src/main/resources，避免兩份漂移
tasks.named('processResources') {
    from('docs/manual') {
        include '*.html', '*.md', 'shots/*.png'
        exclude 'shots/_fail-*.png'
        into 'static/manual'
    }
}

springBoot {
    mainClass = 'com.trading.saga.TradingSagaTccApplication'
}

tasks.named('bootRun') {
    group = 'application'
    description = 'Run backend+static UI at http://localhost:8093'
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]
}
